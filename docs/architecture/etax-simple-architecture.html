<div id="etax-simple-architecture" aria-label="Simplified eTax technical architecture">
  <style>
    #etax-simple-architecture {
      --ink: #172033;
      --muted: #657086;
      --blue: #0b5bd3;
      --line: #9aa9bd;
      background: #ffffff;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 26px 18px;
      width: 100%;
    }

    #etax-simple-architecture * {
      box-sizing: border-box;
    }

    #etax-simple-architecture .architecture {
      margin: 0 auto;
      max-width: 980px;
    }

    #etax-simple-architecture .layer-label {
      color: var(--muted);
      font-weight: 500;
      letter-spacing: 0;
      margin-bottom: 14px;
      text-align: center;
      text-transform: uppercase;
    }

    #etax-simple-architecture .icon-row {
      align-items: start;
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
    }

    #etax-simple-architecture .architecture-node {
      align-items: center;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 92px;
      text-align: center;
    }

    #etax-simple-architecture .architecture-node strong,
    #etax-simple-architecture .architecture-node span {
      display: block;
      font-weight: 500;
      letter-spacing: 0;
      max-width: 132px;
    }

    #etax-simple-architecture .architecture-node small {
      color: var(--muted);
      display: block;
      font-weight: 400;
      letter-spacing: 0;
      max-width: 132px;
    }

    #etax-simple-architecture .icon-shell {
      align-items: center;
      background: #ffffff;
      border: 1px solid #d5dde8;
      border-radius: 50%;
      color: var(--blue);
      display: flex;
      height: 66px;
      justify-content: center;
      width: 66px;
    }

    #etax-simple-architecture .icon-shell.primary {
      background: #eef5ff;
      border-color: #a9c8f3;
      height: 78px;
      width: 78px;
    }

    #etax-simple-architecture .icon-shell svg {
      height: 30px;
      width: 30px;
    }

    #etax-simple-architecture .icon-shell.primary svg {
      height: 38px;
      width: 38px;
    }

    #etax-simple-architecture .brand-svg {
      fill: currentColor;
      height: 34px;
      width: 34px;
    }

    #etax-simple-architecture .typescript {
      color: #3178c6;
    }

    #etax-simple-architecture .supabase {
      color: #3ecf8e;
    }

    #etax-simple-architecture .postgresql {
      color: #4169e1;
    }

    #etax-simple-architecture .brand-image {
      display: block;
      height: auto;
      max-height: 34px;
      max-width: 54px;
      object-fit: contain;
      width: auto;
    }

    #etax-simple-architecture .brand-image.pay {
      max-height: 30px;
      max-width: 58px;
    }

    #etax-simple-architecture .brand-image.postgresql-image {
      max-height: 38px;
      max-width: 38px;
    }

    #etax-simple-architecture .arrow-down {
      height: 52px;
      margin: 0 auto;
      position: relative;
      width: 18px;
    }

    #etax-simple-architecture .arrow-down::before {
      background: var(--line);
      content: "";
      height: 34px;
      left: 8px;
      position: absolute;
      top: 5px;
      width: 2px;
    }

    #etax-simple-architecture .arrow-down::after {
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid var(--line);
      bottom: 5px;
      content: "";
      left: 3px;
      position: absolute;
    }

    #etax-simple-architecture .application {
      align-items: center;
      display: grid;
      gap: 24px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin: 0 auto;
      max-width: 510px;
    }

    #etax-simple-architecture .app-link {
      align-items: center;
      display: flex;
      justify-content: center;
      position: relative;
    }

    #etax-simple-architecture .app-link:not(:last-child)::after {
      background: var(--line);
      content: "";
      height: 2px;
      position: absolute;
      right: -26px;
      top: 35px;
      width: 28px;
    }

    #etax-simple-architecture .core {
      border-bottom: 1px solid #d6dee9;
      border-top: 1px solid #d6dee9;
      padding: 18px 0;
    }

    #etax-simple-architecture .branches {
      display: grid;
      gap: 54px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    #etax-simple-architecture .branch {
      min-width: 0;
    }

    #etax-simple-architecture .verification {
      align-items: center;
      color: var(--blue);
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 18px;
      text-align: center;
    }

    #etax-simple-architecture .verification svg {
      flex: 0 0 auto;
      height: 20px;
      width: 20px;
    }

    #etax-simple-architecture .verification span {
      color: var(--ink);
      font-weight: 500;
      letter-spacing: 0;
    }

    @media (max-width: 700px) {
      #etax-simple-architecture {
        padding: 20px 12px;
      }

      #etax-simple-architecture .application {
        gap: 14px;
      }

      #etax-simple-architecture .app-link:not(:last-child)::after {
        right: -16px;
        width: 18px;
      }

      #etax-simple-architecture .branches {
        gap: 42px;
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 430px) {
      #etax-simple-architecture .application {
        grid-template-columns: 1fr;
      }

      #etax-simple-architecture .app-link:not(:last-child)::after {
        bottom: -20px;
        height: 20px;
        left: 50%;
        right: auto;
        top: auto;
        width: 2px;
      }

      #etax-simple-architecture .icon-row {
        gap: 20px 14px;
      }
    }
  </style>
